<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-labelledby="title desc">
  <title id="title">İşlem makinesi</title><desc id="desc">n girdisine sırasıyla 3 ekleyen, sonucu 2 ile çarpan ve başlangıçtaki n sayısını çıkaran işlem akışı.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
  <rect x="20" y="65" width="120" height="80" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="80" y="100" text-anchor="middle" font-family="Arial" font-size="20" fill="#334155">Girdi</text><text x="80" y="130" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#9a3412">n</text>
  <line x1="140" y1="105" x2="205" y2="105" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="215" y="65" width="130" height="80" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="280" y="115" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1e3a8a">3 ekle</text>
  <line x1="345" y1="105" x2="410" y2="105" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="420" y="65" width="130" height="80" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/><text x="485" y="115" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#166534">2 ile çarp</text>
  <line x1="550" y1="105" x2="615" y2="105" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="625" y="65" width="145" height="80" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/><text x="697" y="115" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#991b1b">n çıkar</text>
  <line x1="770" y1="105" x2="825" y2="105" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><circle cx="855" cy="105" r="32" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="855" y="112" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#334155">Çıkış</text>
