<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">A kümesinden B kümesine bire bir eşleme</title>
  <desc id="desc">A kümesindeki eksi iki, sıfır, bir ve üç elemanları sırasıyla B kümesindeki dört, eksi bir, iki ve yedi elemanlarına gönderiliyor.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <style>
      .set { fill: #f8fafc; stroke: #334155; stroke-width: 2.5; }
      .heading { fill: #0f172a; font: 700 24px system-ui, sans-serif; }
      .label { fill: #0f172a; font: 600 21px system-ui, sans-serif; dominant-baseline: middle; text-anchor: middle; }
      .arrow { fill: none; stroke: #2563eb; stroke-width: 2.75; marker-end: url(#arrow); }
      .dot { fill: #0f172a; }
    </style>
  </defs>
  <rect x="1" y="1" width="718" height="358" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text class="heading" x="205" y="42" text-anchor="middle">A</text>
  <text class="heading" x="515" y="42" text-anchor="middle">B</text>
  <ellipse class="set" cx="205" cy="196" rx="112" ry="142"/>
  <ellipse class="set" cx="515" cy="196" rx="112" ry="142"/>

  <circle class="dot" cx="225" cy="103" r="4"/>
  <circle class="dot" cx="225" cy="165" r="4"/>
  <circle class="dot" cx="225" cy="227" r="4"/>
  <circle class="dot" cx="225" cy="289" r="4"/>
  <text class="label" x="184" y="103">−2</text>
  <text class="label" x="184" y="165">0</text>
  <text class="label" x="184" y="227">1</text>
  <text class="label" x="184" y="289">3</text>

  <circle class="dot" cx="495" cy="103" r="4"/>
  <circle class="dot" cx="495" cy="165" r="4"/>
  <circle class="dot" cx="495" cy="227" r="4"/>
  <circle class="dot" cx="495" cy="289" r="4"/>
  <text class="label" x="536" y="103">4</text>
  <text class="label" x="540" y="165">−1</text>
  <text class="label" x="536" y="227">2</text>
  <text class="label" x="536" y="289">7</text>

  <path class="arrow" d="M231 102 C320 88, 400 88, 489 102"/>
  <path class="arrow" d="M231 164 C320 150, 400 150, 489 164"/>
  <path class="arrow" d="M231 226 C320 212, 400 212, 489 226"/>
  <path class="arrow" d="M231 288 C320 274, 400 274, 489 288"/>
</svg>
