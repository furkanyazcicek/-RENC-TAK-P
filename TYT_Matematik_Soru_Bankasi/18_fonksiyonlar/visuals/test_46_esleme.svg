<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">A kümesinden A kümesine eşleme</title>
  <desc id="desc">Soldaki A kümesinde 1, 2, 3 ve 4 elemanları; sağdaki A kümesinde sırasıyla 3, 4, 2 ve 1 elemanlarına oklarla eşlenmiştir.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b5bd6"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="758" height="418" rx="24" fill="#fbfbff" stroke="#ddddea" stroke-width="2"/>
  <text x="190" y="52" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#25263a">A</text>
  <text x="570" y="52" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#25263a">A</text>
  <ellipse cx="190" cy="220" rx="92" ry="165" fill="#f3f0ff" stroke="#8b78e6" stroke-width="2.5"/>
  <ellipse cx="570" cy="220" rx="92" ry="165" fill="#f3f0ff" stroke="#8b78e6" stroke-width="2.5"/>
  <g font-family="Inter, Arial, sans-serif" font-size="22" font-weight="650" text-anchor="middle" dominant-baseline="middle" fill="#25263a">
    <circle cx="190" cy="100" r="23" fill="#ffffff" stroke="#b7afea" stroke-width="2"/><text x="190" y="100">1</text>
    <circle cx="190" cy="180" r="23" fill="#ffffff" stroke="#b7afea" stroke-width="2"/><text x="190" y="180">2</text>
    <circle cx="190" cy="260" r="23" fill="#ffffff" stroke="#b7afea" stroke-width="2"/><text x="190" y="260">3</text>
    <circle cx="190" cy="340" r="23" fill="#ffffff" stroke="#b7afea" stroke-width="2"/><text x="190" y="340">4</text>
    <circle cx="570" cy="100" r="23" fill="#ffffff" stroke="#b7afea" stroke-width="2"/><text x="570" y="100">1</text>
    <circle cx="570" cy="180" r="23" fill="#ffffff" stroke="#b7afea" stroke-width="2"/><text x="570" y="180">2</text>
    <circle cx="570" cy="260" r="23" fill="#ffffff" stroke="#b7afea" stroke-width="2"/><text x="570" y="260">3</text>
    <circle cx="570" cy="340" r="23" fill="#ffffff" stroke="#b7afea" stroke-width="2"/><text x="570" y="340">4</text>
  </g>
  <g fill="none" stroke="#5b5bd6" stroke-width="4" marker-end="url(#arrow)">
    <path d="M 216 100 C 330 100, 430 260, 542 260"/>
    <path d="M 216 180 C 330 180, 430 340, 542 340"/>
    <path d="M 216 260 C 330 260, 430 180, 542 180"/>
    <path d="M 216 340 C 330 340, 430 100, 542 100"/>
  </g>
</svg>
