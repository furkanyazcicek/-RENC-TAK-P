<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
  <title id="title">Orijin merkezli çember bağıntısı</title>
  <desc id="desc">Merkezi orijin ve yarıçapı üç birim olan çember, eksi üç ile üç arasındaki birçok x değeri için iki farklı y değeri üretmektedir.</desc>
  <defs>
    <marker id="axisArrow40" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="758" height="468" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <path d="M140 45V425 M200 45V425 M260 45V425 M320 45V425 M380 45V425 M440 45V425 M500 45V425 M560 45V425 M620 45V425"/>
    <path d="M80 55H680 M80 115H680 M80 175H680 M80 235H680 M80 295H680 M80 355H680 M80 415H680"/>
  </g>
  <g stroke="#334155" stroke-width="3" marker-end="url(#axisArrow40)">
    <path d="M65 235H705"/>
    <path d="M380 430V35"/>
  </g>
  <g fill="#475569" font-family="Arial, sans-serif" font-size="17">
    <text x="693" y="263">x</text>
    <text x="397" y="48">y</text>
    <text x="359" y="261">0</text>
  </g>
  <circle cx="380" cy="235" r="180" fill="none" stroke="#2563eb" stroke-width="7"/>
  <text x="510" y="105" fill="#1d4ed8" font-family="Georgia, serif" font-size="25" font-style="italic">x² + y² = 9</text>
</svg>
