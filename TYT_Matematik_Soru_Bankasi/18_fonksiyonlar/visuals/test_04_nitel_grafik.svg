<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title desc">
  <title id="title">Parçalı doğrusal f fonksiyonunun grafiği</title>
  <desc id="desc">Grafik eksi üç eksi bir noktasından eksi bir üç noktasına yükseliyor, iki sıfır noktasına alçalıyor ve dört iki noktasına yükseliyor.</desc>
  <defs>
    <marker id="axisArrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#334155"/>
    </marker>
    <style>
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .axis { stroke: #334155; stroke-width: 2; marker-end: url(#axisArrow); }
      .tick { stroke: #64748b; stroke-width: 1.3; }
      .tick-label { fill: #475569; font: 16px system-ui, sans-serif; text-anchor: middle; }
      .axis-label { fill: #0f172a; font: 700 20px system-ui, sans-serif; }
      .graph { fill: none; stroke: #2563eb; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .point { fill: #2563eb; stroke: #ffffff; stroke-width: 3; }
      .name { fill: #1d4ed8; font: italic 700 23px Georgia, serif; }
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="448" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <g aria-hidden="true">
    <line class="grid" x1="150" y1="70" x2="150" y2="390"/>
    <line class="grid" x1="290" y1="70" x2="290" y2="390"/>
    <line class="grid" x1="360" y1="70" x2="360" y2="390"/>
    <line class="grid" x1="500" y1="70" x2="500" y2="390"/>
    <line class="grid" x1="640" y1="70" x2="640" y2="390"/>
    <line class="grid" x1="90" y1="120" x2="700" y2="120"/>
    <line class="grid" x1="90" y1="180" x2="700" y2="180"/>
    <line class="grid" x1="90" y1="240" x2="700" y2="240"/>
    <line class="grid" x1="90" y1="300" x2="700" y2="300"/>
    <line class="grid" x1="90" y1="360" x2="700" y2="360"/>
  </g>
  <line class="axis" x1="78" y1="300" x2="718" y2="300"/>
  <line class="axis" x1="360" y1="408" x2="360" y2="45"/>
  <text class="axis-label" x="722" y="326">x</text>
  <text class="axis-label" x="377" y="52">y</text>
  <text class="tick-label" x="345" y="323">0</text>
  <g aria-hidden="true">
    <line class="tick" x1="290" y1="294" x2="290" y2="306"/>
    <line class="tick" x1="500" y1="294" x2="500" y2="306"/>
    <text class="tick-label" x="290" y="329">−1</text>
    <text class="tick-label" x="500" y="329">2</text>
    <line class="tick" x1="354" y1="120" x2="366" y2="120"/>
    <text class="tick-label" x="337" y="126">3</text>
  </g>
  <polyline class="graph" points="150,360 290,120 500,300 640,180"/>
  <circle class="point" cx="150" cy="360" r="7"/>
  <circle class="point" cx="290" cy="120" r="7"/>
  <circle class="point" cx="500" cy="300" r="7"/>
  <circle class="point" cx="640" cy="180" r="7"/>
  <text class="name" x="650" y="170">f</text>
</svg>
