<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title desc">
  <title id="title">İki doğrusal fonksiyonun karşılaştırma grafiği</title>
  <desc id="desc">Artan f doğrusu ile azalan g doğrusu dördüncü zaman biriminde kesişiyor.</desc>
  <defs>
    <marker id="axisArrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#334155"/>
    </marker>
    <style>
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .axis { stroke: #334155; stroke-width: 2; marker-end: url(#axisArrow); }
      .tick { stroke: #64748b; stroke-width: 1.3; }
      .tick-label { fill: #475569; font: 16px system-ui, sans-serif; text-anchor: middle; }
      .axis-label { fill: #0f172a; font: 700 19px system-ui, sans-serif; }
      .f-line { stroke: #2563eb; stroke-width: 5; stroke-linecap: round; }
      .g-line { stroke: #ea580c; stroke-width: 5; stroke-linecap: round; }
      .point { fill: #7c3aed; stroke: #ffffff; stroke-width: 3; }
      .f-name { fill: #1d4ed8; font: italic 700 23px Georgia, serif; }
      .g-name { fill: #c2410c; font: italic 700 23px Georgia, serif; }
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="448" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <g aria-hidden="true">
    <line class="grid" x1="100" y1="70" x2="100" y2="385"/>
    <line class="grid" x1="260" y1="70" x2="260" y2="385"/>
    <line class="grid" x1="420" y1="70" x2="420" y2="385"/>
    <line class="grid" x1="580" y1="70" x2="580" y2="385"/>
    <line class="grid" x1="90" y1="105" x2="690" y2="105"/>
    <line class="grid" x1="90" y1="210" x2="690" y2="210"/>
    <line class="grid" x1="90" y1="315" x2="690" y2="315"/>
    <line class="grid" x1="90" y1="385" x2="690" y2="385"/>
  </g>
  <line class="axis" x1="78" y1="385" x2="718" y2="385"/>
  <line class="axis" x1="100" y1="410" x2="100" y2="45"/>
  <text class="axis-label" x="690" y="421" text-anchor="end">Zaman (t)</text>
  <text class="axis-label" x="114" y="52">Değer</text>
  <text class="tick-label" x="84" y="407">0</text>
  <line class="tick" x1="420" y1="379" x2="420" y2="391"/>
  <text class="tick-label" x="420" y="412">4</text>
  <line class="f-line" x1="100" y1="350" x2="660" y2="105"/>
  <line class="g-line" x1="100" y1="70" x2="660" y2="315"/>
  <circle class="point" cx="420" cy="210" r="8"/>
  <text class="f-name" x="648" y="95">f</text>
  <text class="g-name" x="648" y="340">g</text>
</svg>
