<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="title desc">
  <title id="title">Fonksiyon grafiği ve y eşittir x doğrusu</title>
  <desc id="desc">Koordinat düzleminde y eşittir x doğrusu ile f fonksiyonunun grafiği üzerinde P iki virgül eksi bir noktası gösterilmiştir.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="718" height="468" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <path d="M150 45V405 M200 45V405 M250 45V405 M300 45V405 M350 45V405 M400 45V405 M450 45V405 M500 45V405"/>
    <path d="M120 50H540 M120 100H540 M120 150H540 M120 200H540 M120 250H540 M120 300H540 M120 350H540 M120 400H540"/>
  </g>
  <g stroke="#334155" stroke-width="3" marker-end="url(#arrow)">
    <path d="M110 250H565"/>
    <path d="M300 415V35"/>
  </g>
  <g fill="#475569" font-family="Arial, sans-serif" font-size="18">
    <text x="548" y="278">x</text>
    <text x="315" y="48">y</text>
    <text x="280" y="274">0</text>
    <text x="392" y="274">2</text>
    <text x="270" y="307">−1</text>
  </g>
  <path d="M145 405L505 45" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 9"/>
  <text x="500" y="72" fill="#64748b" font-family="Arial, sans-serif" font-size="20" font-style="italic">y = x</text>
  <path d="M175 150 C220 170 260 210 300 220 C345 232 370 272 400 300 C432 330 465 345 510 360" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
  <text x="500" y="346" fill="#1d4ed8" font-family="Georgia, serif" font-size="30" font-style="italic">f</text>
  <path d="M400 250V300 M300 300H400" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="400" cy="300" r="9" fill="#2563eb" stroke="#ffffff" stroke-width="4"/>
  <text x="414" y="325" fill="#0f172a" font-family="Arial, sans-serif" font-size="20" font-weight="700">P(2, −1)</text>
</svg>
