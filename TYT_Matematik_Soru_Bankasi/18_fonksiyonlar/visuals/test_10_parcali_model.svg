<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title desc">
  <title id="title">Üç parçalı doğrusal f fonksiyonu</title>
  <desc id="desc">Fonksiyon sıfır iki noktasından üç sekiz noktasına artıyor, beşinci zaman birimine kadar sekizde sabit kalıyor ve yedi dört noktasına azalıyor.</desc>
  <defs>
    <marker id="axisArrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#334155"/>
    </marker>
    <style>
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .guide { stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 6 6; }
      .axis { stroke: #334155; stroke-width: 2; marker-end: url(#axisArrow); }
      .tick { stroke: #64748b; stroke-width: 1.3; }
      .tick-label { fill: #475569; font: 16px system-ui, sans-serif; text-anchor: middle; }
      .axis-label { fill: #0f172a; font: 700 19px system-ui, sans-serif; }
      .graph { fill: none; stroke: #2563eb; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .point { fill: #2563eb; stroke: #ffffff; stroke-width: 3; }
      .name { fill: #1d4ed8; font: italic 700 23px Georgia, serif; }
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="448" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <g aria-hidden="true">
    <line class="grid" x1="100" y1="70" x2="100" y2="380"/>
    <line class="grid" x1="240" y1="70" x2="240" y2="380"/>
    <line class="grid" x1="310" y1="70" x2="310" y2="380"/>
    <line class="grid" x1="450" y1="70" x2="450" y2="380"/>
    <line class="grid" x1="590" y1="70" x2="590" y2="380"/>
    <line class="grid" x1="90" y1="100" x2="690" y2="100"/>
    <line class="grid" x1="90" y1="240" x2="690" y2="240"/>
    <line class="grid" x1="90" y1="310" x2="690" y2="310"/>
    <line class="grid" x1="90" y1="380" x2="690" y2="380"/>
  </g>
  <line class="guide" x1="100" y1="100" x2="450" y2="100"/>
  <line class="axis" x1="78" y1="380" x2="718" y2="380"/>
  <line class="axis" x1="100" y1="410" x2="100" y2="45"/>
  <text class="axis-label" x="695" y="420" text-anchor="end">Zaman (t)</text>
  <text class="axis-label" x="114" y="52">f(t)</text>
  <text class="tick-label" x="84" y="403">0</text>
  <g aria-hidden="true">
    <line class="tick" x1="310" y1="374" x2="310" y2="386"/>
    <line class="tick" x1="450" y1="374" x2="450" y2="386"/>
    <line class="tick" x1="590" y1="374" x2="590" y2="386"/>
    <text class="tick-label" x="310" y="406">3</text>
    <text class="tick-label" x="450" y="406">5</text>
    <text class="tick-label" x="590" y="406">7</text>
    <line class="tick" x1="94" y1="310" x2="106" y2="310"/>
    <line class="tick" x1="94" y1="240" x2="106" y2="240"/>
    <line class="tick" x1="94" y1="100" x2="106" y2="100"/>
    <text class="tick-label" x="76" y="316">2</text>
    <text class="tick-label" x="76" y="246">4</text>
    <text class="tick-label" x="76" y="106">8</text>
  </g>
  <polyline class="graph" points="100,310 310,100 450,100 590,240"/>
  <circle class="point" cx="100" cy="310" r="7"/>
  <circle class="point" cx="310" cy="100" r="7"/>
  <circle class="point" cx="450" cy="100" r="7"/>
  <circle class="point" cx="590" cy="240" r="7"/>
  <text class="name" x="604" y="230">f</text>
</svg>
