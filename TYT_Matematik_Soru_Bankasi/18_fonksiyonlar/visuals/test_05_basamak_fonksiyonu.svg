<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title desc">
  <title id="title">Üç parçalı basamak fonksiyonu</title>
  <desc id="desc">Fonksiyon x sıfırdan küçükken eksi bir, sıfır dahil sıfır ile iki arasında bir ve iki dahil ikiden büyük değerlerde üç değerini alıyor.</desc>
  <defs>
    <marker id="axisArrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#334155"/>
    </marker>
    <marker id="blueArrow" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L16,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <marker id="blueArrowStart" markerWidth="16" markerHeight="12" refX="1" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M16,0 L0,6 L16,12 Z" fill="#2563eb"/>
    </marker>
    <style>
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .axis { stroke: #334155; stroke-width: 2; marker-end: url(#axisArrow); }
      .tick { stroke: #64748b; stroke-width: 1.3; }
      .tick-label { fill: #475569; font: 16px system-ui, sans-serif; text-anchor: middle; }
      .axis-label { fill: #0f172a; font: 700 20px system-ui, sans-serif; }
      .step { fill: none; stroke: #2563eb; stroke-width: 5; stroke-linecap: round; }
      .left-step { marker-start: url(#blueArrowStart); }
      .right-step { marker-end: url(#blueArrow); }
      .closed { fill: #2563eb; stroke: #ffffff; stroke-width: 3; }
      .open { fill: #ffffff; stroke: #2563eb; stroke-width: 4; }
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="448" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <g aria-hidden="true">
    <line class="grid" x1="130" y1="70" x2="130" y2="390"/>
    <line class="grid" x1="270" y1="70" x2="270" y2="390"/>
    <line class="grid" x1="340" y1="70" x2="340" y2="390"/>
    <line class="grid" x1="480" y1="70" x2="480" y2="390"/>
    <line class="grid" x1="620" y1="70" x2="620" y2="390"/>
    <line class="grid" x1="90" y1="120" x2="700" y2="120"/>
    <line class="grid" x1="90" y1="240" x2="700" y2="240"/>
    <line class="grid" x1="90" y1="300" x2="700" y2="300"/>
    <line class="grid" x1="90" y1="360" x2="700" y2="360"/>
  </g>
  <line class="axis" x1="78" y1="300" x2="718" y2="300"/>
  <line class="axis" x1="340" y1="408" x2="340" y2="45"/>
  <text class="axis-label" x="722" y="326">x</text>
  <text class="axis-label" x="357" y="52">y</text>
  <text class="tick-label" x="325" y="324">0</text>
  <g aria-hidden="true">
    <line class="tick" x1="480" y1="294" x2="480" y2="306"/>
    <text class="tick-label" x="480" y="329">2</text>
    <line class="tick" x1="334" y1="360" x2="346" y2="360"/>
    <line class="tick" x1="334" y1="240" x2="346" y2="240"/>
    <line class="tick" x1="334" y1="120" x2="346" y2="120"/>
    <text class="tick-label" x="316" y="366">−1</text>
    <text class="tick-label" x="318" y="246">1</text>
    <text class="tick-label" x="318" y="126">3</text>
  </g>
  <line class="step left-step" x1="105" y1="360" x2="340" y2="360"/>
  <line class="step" x1="340" y1="240" x2="480" y2="240"/>
  <line class="step right-step" x1="480" y1="120" x2="680" y2="120"/>
  <circle class="open" cx="340" cy="360" r="8"/>
  <circle class="closed" cx="340" cy="240" r="8"/>
  <circle class="open" cx="480" cy="240" r="8"/>
  <circle class="closed" cx="480" cy="120" r="8"/>
</svg>
