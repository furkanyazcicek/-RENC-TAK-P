<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title desc">
  <title id="title">Parçalı doğrusal f fonksiyonunun grafiği</title>
  <desc id="desc">Grafik eksi dörtten eksi ikiye artıyor, eksi ikiden bire sabit kalıyor, birden üçe azalıyor ve üçten beşe yeniden artıyor.</desc>
  <defs>
    <marker id="axisArrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#334155"/>
    </marker>
    <style>
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .axis { stroke: #334155; stroke-width: 2; marker-end: url(#axisArrow); }
      .tick { stroke: #64748b; stroke-width: 1.4; }
      .tick-label { fill: #475569; font: 16px system-ui, sans-serif; text-anchor: middle; }
      .axis-label { fill: #0f172a; font: 600 19px system-ui, sans-serif; }
      .graph { fill: none; stroke: #2563eb; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .point { fill: #2563eb; stroke: #ffffff; stroke-width: 3; }
      .name { fill: #1d4ed8; font: italic 700 22px Georgia, serif; }
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="448" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <g aria-hidden="true">
    <line class="grid" x1="100" y1="70" x2="100" y2="390"/>
    <line class="grid" x1="160" y1="70" x2="160" y2="390"/>
    <line class="grid" x1="220" y1="70" x2="220" y2="390"/>
    <line class="grid" x1="280" y1="70" x2="280" y2="390"/>
    <line class="grid" x1="340" y1="70" x2="340" y2="390"/>
    <line class="grid" x1="400" y1="70" x2="400" y2="390"/>
    <line class="grid" x1="460" y1="70" x2="460" y2="390"/>
    <line class="grid" x1="520" y1="70" x2="520" y2="390"/>
    <line class="grid" x1="580" y1="70" x2="580" y2="390"/>
    <line class="grid" x1="640" y1="70" x2="640" y2="390"/>
    <line class="grid" x1="700" y1="70" x2="700" y2="390"/>
    <line class="grid" x1="100" y1="90" x2="700" y2="90"/>
    <line class="grid" x1="100" y1="150" x2="700" y2="150"/>
    <line class="grid" x1="100" y1="210" x2="700" y2="210"/>
    <line class="grid" x1="100" y1="270" x2="700" y2="270"/>
    <line class="grid" x1="100" y1="330" x2="700" y2="330"/>
    <line class="grid" x1="100" y1="390" x2="700" y2="390"/>
  </g>

  <line class="axis" x1="80" y1="330" x2="718" y2="330"/>
  <line class="axis" x1="340" y1="408" x2="340" y2="48"/>
  <text class="axis-label" x="722" y="354">x</text>
  <text class="axis-label" x="357" y="52">y</text>
  <text class="tick-label" x="326" y="352">0</text>

  <g aria-hidden="true">
    <line class="tick" x1="100" y1="324" x2="100" y2="336"/>
    <line class="tick" x1="220" y1="324" x2="220" y2="336"/>
    <line class="tick" x1="400" y1="324" x2="400" y2="336"/>
    <line class="tick" x1="520" y1="324" x2="520" y2="336"/>
    <line class="tick" x1="640" y1="324" x2="640" y2="336"/>
    <text class="tick-label" x="100" y="358">−4</text>
    <text class="tick-label" x="220" y="358">−2</text>
    <text class="tick-label" x="400" y="358">1</text>
    <text class="tick-label" x="520" y="358">3</text>
    <text class="tick-label" x="640" y="358">5</text>
  </g>

  <polyline class="graph" points="100,270 220,90 400,90 520,390 640,210"/>
  <circle class="point" cx="100" cy="270" r="6"/>
  <circle class="point" cx="220" cy="90" r="6"/>
  <circle class="point" cx="400" cy="90" r="6"/>
  <circle class="point" cx="520" cy="390" r="6"/>
  <circle class="point" cx="640" cy="210" r="6"/>
  <text class="name" x="655" y="202">f</text>
</svg>
