<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title desc">
  <title id="title">Başlangıç noktasına uzaklık-zaman grafiği</title>
  <desc id="desc">Uzaklık sıfırdan altı birime yükseliyor, üçüncü ve beşinci dakikalar arasında altı birimde sabit kalıyor, sekizinci dakikada iki birime düşüyor ve onuncu dakikaya kadar iki birimde sabit kalıyor.</desc>
  <defs>
    <marker id="axisArrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#334155"/>
    </marker>
    <style>
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .guide { stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 6 6; }
      .axis { stroke: #334155; stroke-width: 2; marker-end: url(#axisArrow); }
      .tick { stroke: #64748b; stroke-width: 1.3; }
      .tick-label { fill: #475569; font: 16px system-ui, sans-serif; text-anchor: middle; }
      .axis-label { fill: #0f172a; font: 600 18px system-ui, sans-serif; }
      .graph { fill: none; stroke: #2563eb; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .point { fill: #2563eb; stroke: #ffffff; stroke-width: 3; }
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="448" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <g aria-hidden="true">
    <line class="grid" x1="100" y1="80" x2="100" y2="360"/>
    <line class="grid" x1="210" y1="80" x2="210" y2="360"/>
    <line class="grid" x1="320" y1="80" x2="320" y2="360"/>
    <line class="grid" x1="430" y1="80" x2="430" y2="360"/>
    <line class="grid" x1="540" y1="80" x2="540" y2="360"/>
    <line class="grid" x1="650" y1="80" x2="650" y2="360"/>
    <line class="grid" x1="100" y1="120" x2="680" y2="120"/>
    <line class="grid" x1="100" y1="200" x2="680" y2="200"/>
    <line class="grid" x1="100" y1="280" x2="680" y2="280"/>
    <line class="grid" x1="100" y1="360" x2="680" y2="360"/>
  </g>

  <line class="guide" x1="100" y1="120" x2="375" y2="120"/>
  <line class="guide" x1="100" y1="280" x2="650" y2="280"/>
  <line class="axis" x1="78" y1="360" x2="710" y2="360"/>
  <line class="axis" x1="100" y1="405" x2="100" y2="48"/>
  <text class="axis-label" x="690" y="414" text-anchor="end">Zaman (dakika)</text>
  <text class="axis-label" x="112" y="54">Uzaklık (birim)</text>
  <text class="tick-label" x="84" y="382">0</text>

  <g aria-hidden="true">
    <line class="tick" x1="265" y1="354" x2="265" y2="366"/>
    <line class="tick" x1="375" y1="354" x2="375" y2="366"/>
    <line class="tick" x1="540" y1="354" x2="540" y2="366"/>
    <line class="tick" x1="650" y1="354" x2="650" y2="366"/>
    <text class="tick-label" x="265" y="388">3</text>
    <text class="tick-label" x="375" y="388">5</text>
    <text class="tick-label" x="540" y="388">8</text>
    <text class="tick-label" x="650" y="388">10</text>
    <line class="tick" x1="94" y1="280" x2="106" y2="280"/>
    <line class="tick" x1="94" y1="120" x2="106" y2="120"/>
    <text class="tick-label" x="76" y="286">2</text>
    <text class="tick-label" x="76" y="126">6</text>
  </g>

  <polyline class="graph" points="100,360 265,120 375,120 540,280 650,280"/>
  <circle class="point" cx="100" cy="360" r="7"/>
  <circle class="point" cx="265" cy="120" r="7"/>
  <circle class="point" cx="375" cy="120" r="7"/>
  <circle class="point" cx="540" cy="280" r="7"/>
  <circle class="point" cx="650" cy="280" r="7"/>
</svg>
