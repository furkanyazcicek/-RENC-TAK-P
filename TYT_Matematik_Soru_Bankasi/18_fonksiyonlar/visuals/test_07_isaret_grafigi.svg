<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title desc">
  <title id="title">f fonksiyonunun işaret grafiği</title>
  <desc id="desc">Grafik eksi iki, bir ve dört apsislerinde x eksenini kesiyor; eksi ikiden önce ve bir ile dört arasında eksenin altında kalıyor.</desc>
  <defs>
    <marker id="axisArrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#334155"/>
    </marker>
    <style>
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .axis { stroke: #334155; stroke-width: 2; marker-end: url(#axisArrow); }
      .tick { stroke: #64748b; stroke-width: 1.3; }
      .tick-label { fill: #475569; font: 16px system-ui, sans-serif; text-anchor: middle; }
      .axis-label { fill: #0f172a; font: 700 20px system-ui, sans-serif; }
      .graph { fill: none; stroke: #2563eb; stroke-width: 5; stroke-linecap: round; }
      .root { fill: #2563eb; stroke: #ffffff; stroke-width: 3; }
      .name { fill: #1d4ed8; font: italic 700 23px Georgia, serif; }
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="448" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <g aria-hidden="true">
    <line class="grid" x1="130" y1="70" x2="130" y2="390"/>
    <line class="grid" x1="250" y1="70" x2="250" y2="390"/>
    <line class="grid" x1="370" y1="70" x2="370" y2="390"/>
    <line class="grid" x1="430" y1="70" x2="430" y2="390"/>
    <line class="grid" x1="550" y1="70" x2="550" y2="390"/>
    <line class="grid" x1="610" y1="70" x2="610" y2="390"/>
    <line class="grid" x1="90" y1="130" x2="700" y2="130"/>
    <line class="grid" x1="90" y1="250" x2="700" y2="250"/>
    <line class="grid" x1="90" y1="370" x2="700" y2="370"/>
  </g>
  <line class="axis" x1="78" y1="250" x2="718" y2="250"/>
  <line class="axis" x1="370" y1="408" x2="370" y2="45"/>
  <text class="axis-label" x="722" y="276">x</text>
  <text class="axis-label" x="387" y="52">y</text>
  <text class="tick-label" x="355" y="274">0</text>
  <g aria-hidden="true">
    <line class="tick" x1="250" y1="244" x2="250" y2="256"/>
    <line class="tick" x1="430" y1="244" x2="430" y2="256"/>
    <line class="tick" x1="610" y1="244" x2="610" y2="256"/>
    <text class="tick-label" x="250" y="280">−2</text>
    <text class="tick-label" x="430" y="280">1</text>
    <text class="tick-label" x="610" y="280">4</text>
  </g>
  <path class="graph" d="M100 330 C160 350 210 300 250 250 C300 180 370 160 430 250 C480 330 550 350 610 250 C650 190 680 160 700 150"/>
  <circle class="root" cx="250" cy="250" r="7"/>
  <circle class="root" cx="430" cy="250" r="7"/>
  <circle class="root" cx="610" cy="250" r="7"/>
  <text class="name" x="690" y="140">f</text>
</svg>
