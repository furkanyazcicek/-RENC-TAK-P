  <text x="540" y="53" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="25" font-weight="700">A (görüntü)</text>
  <ellipse cx="220" cy="250" rx="105" ry="175" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
  <ellipse cx="540" cy="250" rx="105" ry="175" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="3"/>
