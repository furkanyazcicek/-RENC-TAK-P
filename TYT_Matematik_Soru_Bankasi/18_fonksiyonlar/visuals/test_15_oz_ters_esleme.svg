<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
  <title id="title">Öz-ters fonksiyonun eksik eşleme şeması</title>
  <desc id="desc">Soldaki A kümesinde 1 sağdaki 3'e, 3 sağdaki 1'e ve 2 sağdaki 2'ye gönderilmektedir. 4'ün görüntüsü soru işaretiyle belirtilmiştir.</desc>
