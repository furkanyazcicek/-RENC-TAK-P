  <polyline points="90,355 150,245 210,135 330,135 390,245 450,355 510,355 570,245 630,135" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#2563eb" stroke="#ffffff" stroke-width="4">
