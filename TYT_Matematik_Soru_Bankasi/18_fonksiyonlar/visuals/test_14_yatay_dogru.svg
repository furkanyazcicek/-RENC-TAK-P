  </defs>
  <rect x="1" y="1" width="758" height="468" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <path d="M90 70V405 M150 70V405 M210 70V405 M270 70V405 M330 70V405 M390 70V405 M450 70V405 M510 70V405 M570 70V405 M630 70V405"/>
    <path d="M70 80H680 M70 135H680 M70 190H680 M70 245H680 M70 300H680 M70 355H680 M70 410H680"/>
