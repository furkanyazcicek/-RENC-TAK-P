<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
  <title id="title">Fonksiyon grafiği ile y eşittir 1 doğrusu</title>
  <desc id="desc">Koordinat düzlemindeki fonksiyon grafiği, y eşittir 1 yatay doğrusunu üç farklı noktada kesmektedir.</desc>
  <defs>
    <marker id="axisArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#334155"/>
