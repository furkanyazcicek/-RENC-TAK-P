  <polyline points="100,340 165,210 230,80 295,210 360,340 425,210 490,80 555,210 620,340" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#2563eb" stroke="#ffffff" stroke-width="4">
