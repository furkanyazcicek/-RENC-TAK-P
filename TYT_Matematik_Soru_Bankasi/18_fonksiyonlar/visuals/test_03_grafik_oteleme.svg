<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title desc">
  <title id="title">f ve g mutlak değer fonksiyonlarının grafikleri</title>
  <desc id="desc">f grafiğinin tepe noktası sıfır sıfır, aynı biçimdeki g grafiğinin tepe noktası iki bir noktasıdır.</desc>
  <defs>
    <marker id="axisArrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#334155"/>
    </marker>
    <style>
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .axis { stroke: #334155; stroke-width: 2; marker-end: url(#axisArrow); }
      .tick { stroke: #64748b; stroke-width: 1.3; }
      .tick-label { fill: #475569; font: 16px system-ui, sans-serif; text-anchor: middle; }
      .axis-label { fill: #0f172a; font: 700 20px system-ui, sans-serif; }
      .f-line { fill: none; stroke: #2563eb; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .g-line { fill: none; stroke: #ea580c; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .vertex-f { fill: #2563eb; stroke: #ffffff; stroke-width: 3; }
      .vertex-g { fill: #ea580c; stroke: #ffffff; stroke-width: 3; }
      .f-name { fill: #1d4ed8; font: italic 700 23px Georgia, serif; }
      .g-name { fill: #c2410c; font: italic 700 23px Georgia, serif; }
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="448" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <g aria-hidden="true">
    <line class="grid" x1="120" y1="70" x2="120" y2="390"/>
    <line class="grid" x1="230" y1="70" x2="230" y2="390"/>
    <line class="grid" x1="340" y1="70" x2="340" y2="390"/>
    <line class="grid" x1="450" y1="70" x2="450" y2="390"/>
    <line class="grid" x1="560" y1="70" x2="560" y2="390"/>
    <line class="grid" x1="670" y1="70" x2="670" y2="390"/>
    <line class="grid" x1="90" y1="95" x2="700" y2="95"/>
    <line class="grid" x1="90" y1="150" x2="700" y2="150"/>
    <line class="grid" x1="90" y1="205" x2="700" y2="205"/>
    <line class="grid" x1="90" y1="260" x2="700" y2="260"/>
    <line class="grid" x1="90" y1="315" x2="700" y2="315"/>
    <line class="grid" x1="90" y1="370" x2="700" y2="370"/>
  </g>

  <line class="axis" x1="78" y1="370" x2="718" y2="370"/>
  <line class="axis" x1="340" y1="408" x2="340" y2="45"/>
  <text class="axis-label" x="722" y="396">x</text>
  <text class="axis-label" x="357" y="52">y</text>
  <text class="tick-label" x="325" y="392">0</text>

  <g aria-hidden="true">
    <line class="tick" x1="230" y1="364" x2="230" y2="376"/>
    <line class="tick" x1="450" y1="364" x2="450" y2="376"/>
    <text class="tick-label" x="230" y="397">−2</text>
    <text class="tick-label" x="450" y="397">2</text>
    <line class="tick" x1="334" y1="315" x2="346" y2="315"/>
    <text class="tick-label" x="318" y="321">1</text>
  </g>

  <polyline class="f-line" points="120,150 340,370 560,150"/>
  <polyline class="g-line" points="230,95 450,315 670,95"/>
  <circle class="vertex-f" cx="340" cy="370" r="7"/>
  <circle class="vertex-g" cx="450" cy="315" r="7"/>
  <text class="f-name" x="132" y="140">f</text>
  <text class="g-name" x="650" y="85">g</text>
</svg>
