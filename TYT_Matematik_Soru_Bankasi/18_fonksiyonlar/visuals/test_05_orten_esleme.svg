<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">A kümesinden B kümesine örten eşleme</title>
  <desc id="desc">A kümesindeki bir a elemanına, iki ve üç b elemanına, dört ise c elemanına gönderiliyor.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <style>
      .set { fill: #f8fafc; stroke: #334155; stroke-width: 2.5; }
      .heading { fill: #0f172a; font: 700 24px system-ui, sans-serif; }
      .label { fill: #0f172a; font: 600 21px system-ui, sans-serif; dominant-baseline: middle; text-anchor: middle; }
      .arrow { fill: none; stroke: #2563eb; stroke-width: 2.75; marker-end: url(#arrow); }
      .dot { fill: #0f172a; }
    </style>
  </defs>
  <rect x="1" y="1" width="718" height="358" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text class="heading" x="205" y="42" text-anchor="middle">A</text>
  <text class="heading" x="515" y="42" text-anchor="middle">B</text>
  <ellipse class="set" cx="205" cy="196" rx="112" ry="142"/>
  <ellipse class="set" cx="515" cy="196" rx="112" ry="142"/>

  <circle class="dot" cx="225" cy="95" r="4"/>
  <circle class="dot" cx="225" cy="155" r="4"/>
  <circle class="dot" cx="225" cy="215" r="4"/>
  <circle class="dot" cx="225" cy="275" r="4"/>
  <text class="label" x="184" y="95">1</text>
  <text class="label" x="184" y="155">2</text>
  <text class="label" x="184" y="215">3</text>
  <text class="label" x="184" y="275">4</text>

  <circle class="dot" cx="495" cy="100" r="4"/>
  <circle class="dot" cx="495" cy="185" r="4"/>
  <circle class="dot" cx="495" cy="270" r="4"/>
  <text class="label" x="536" y="100">a</text>
  <text class="label" x="536" y="185">b</text>
  <text class="label" x="536" y="270">c</text>

  <path class="arrow" d="M231 95 C320 82, 400 85, 489 99"/>
  <path class="arrow" d="M231 155 C320 150, 400 165, 489 183"/>
  <path class="arrow" d="M231 215 C320 220, 400 202, 489 187"/>
  <path class="arrow" d="M231 275 C320 288, 400 284, 489 271"/>
</svg>
