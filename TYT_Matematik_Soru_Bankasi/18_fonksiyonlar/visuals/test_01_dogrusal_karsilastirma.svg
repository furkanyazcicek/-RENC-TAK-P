<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="title desc">
  <title id="title">Doğrusal f ve g fonksiyonlarının grafikleri</title>
  <desc id="desc">f doğrusu artan, g doğrusu azalandır. Doğrular 1 virgül 3 noktasında kesişir; g doğrusu x eksenini 4 noktasında keser.</desc>
  <rect width="640" height="380" rx="20" fill="#ffffff"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <path d="M40 30V345M100 30V345M160 30V345M220 30V345M280 30V345M340 30V345M400 30V345M460 30V345M520 30V345"/>
    <path d="M40 30H520M40 75H520M40 120H520M40 165H520M40 210H520M40 255H520M40 300H520M40 345H520"/>
  </g>
  <g stroke="#1f2937" stroke-width="2.5" stroke-linecap="round">
    <path d="M35 300H548"/>
    <path d="M220 354V20"/>
    <path d="m548 300-10-6v12z" fill="#1f2937"/>
    <path d="m220 20-6 10h12z" fill="#1f2937"/>
  </g>
  <path d="M40 345 460 30" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <path d="M100 30 520 345" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 6">
    <path d="M280 165V300M220 165H280"/>
    <path d="M460 300V30"/>
  </g>
  <circle cx="280" cy="165" r="6" fill="#111827"/>
  <g font-family="Inter, Arial, sans-serif" font-size="18" fill="#1f2937">
    <text x="554" y="306">x</text>
    <text x="228" y="24">y</text>
    <text x="204" y="322">O</text>
    <text x="274" y="324">1</text>
    <text x="453" y="324">4</text>
    <text x="198" y="172">3</text>
    <text x="424" y="54" fill="#2563eb" font-weight="700">f</text>
    <text x="488" y="326" fill="#dc2626" font-weight="700">g</text>
  </g>
</svg>
