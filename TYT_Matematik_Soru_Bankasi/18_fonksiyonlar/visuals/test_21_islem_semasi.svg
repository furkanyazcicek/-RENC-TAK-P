<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" role="img" aria-labelledby="title desc">
  <title id="title">Üç aşamalı fonksiyon işlem şeması</title>
  <desc id="desc">x girdisinden iki çıkarılır, sonuç karesi alınır ve sonuca bir eklenerek h x elde edilir.</desc>
  <defs>
    <marker id="flowArrow21" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="818" height="298" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="75" cy="150" r="38" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
    <text x="75" y="159" fill="#0f172a" font-size="28" font-weight="700">x</text>

    <rect x="180" y="105" width="150" height="90" rx="18" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="3"/>
    <text x="255" y="143" fill="#0f172a" font-size="21" font-weight="700">2 çıkar</text>
    <text x="255" y="174" fill="#6d28d9" font-size="18">x − 2</text>

    <rect x="385" y="105" width="150" height="90" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="460" y="143" fill="#0f172a" font-size="21" font-weight="700">Karesini al</text>
    <text x="460" y="174" fill="#1d4ed8" font-size="18">(x − 2)²</text>

    <rect x="590" y="105" width="150" height="90" rx="18" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
    <text x="665" y="143" fill="#0f172a" font-size="21" font-weight="700">1 ekle</text>
    <text x="665" y="174" fill="#b45309" font-size="18">h(x)</text>
  </g>
  <g fill="none" stroke="#475569" stroke-width="4" marker-end="url(#flowArrow21)">
    <path d="M116 150H168"/>
    <path d="M332 150H373"/>
    <path d="M537 150H578"/>
  </g>
</svg>
