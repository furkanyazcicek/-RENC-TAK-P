<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
  <title id="title">Kökleri eksi bir ve üç olan parabol</title>
  <desc id="desc">Yukarı açılan parabol x eksenini eksi bir ve üç noktalarında, y eksenini eksi üç noktasında keser. Tepe noktası bir, eksi dörttür.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#394052"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="758" height="468" rx="24" fill="#fbfbff" stroke="#ddddea" stroke-width="2"/>
  <g stroke="#e7e8f0" stroke-width="1">
    <path d="M 60 80 H 690 M 60 150 H 690 M 60 290 H 690 M 60 360 H 690"/>
    <path d="M 120 45 V 410 M 180 45 V 410 M 240 45 V 410 M 360 45 V 410 M 420 45 V 410 M 480 45 V 410 M 540 45 V 410 M 600 45 V 410"/>
  </g>
  <g fill="none" stroke="#394052" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M 55 220 H 705"/>
    <path d="M 300 415 V 40"/>
  </g>
  <path d="M 180 45 Q 360 675 540 45" fill="none" stroke="#4f67d8" stroke-width="5" stroke-linecap="round"/>
  <g fill="#7548d8" stroke="#ffffff" stroke-width="3">
    <circle cx="240" cy="220" r="8"/>
    <circle cx="480" cy="220" r="8"/>
    <circle cx="300" cy="325" r="8"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="17" fill="#555c6e">
    <text x="709" y="227">x</text>
    <text x="309" y="43">y</text>
    <text x="232" y="246">−1</text>
    <text x="474" y="246">3</text>
    <text x="307" y="241">0</text>
    <text x="267" y="330">−3</text>
    <text x="348" y="386">T(1, −4)</text>
    <text x="522" y="79" font-size="20" font-weight="700" fill="#4f67d8">y = P(x)</text>
  </g>
</svg>
