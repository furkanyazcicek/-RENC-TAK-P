  <title id="title">Zorunlu noktadan geçen kareli yol</title>
  <desc id="desc">A sol altta, P iki birim sağ ve bir birim yukarıda, B dört birim sağ ve dört birim yukarıdadır.</desc>
  <rect width="760" height="470" rx="24" fill="#f8fafc"/>
  <g stroke="#cbd5e1" stroke-width="3">
    <line x1="150" y1="55" x2="610" y2="55"/><line x1="150" y1="145" x2="610" y2="145"/>
    <line x1="150" y1="235" x2="610" y2="235"/><line x1="150" y1="325" x2="610" y2="325"/><line x1="150" y1="415" x2="610" y2="415"/>
    <line x1="150" y1="55" x2="150" y2="415"/><line x1="265" y1="55" x2="265" y2="415"/>
    <line x1="380" y1="55" x2="380" y2="415"/><line x1="495" y1="55" x2="495" y2="415"/><line x1="610" y1="55" x2="610" y2="415"/>
  </g>
  <circle cx="150" cy="415" r="12" fill="#2563eb"/><circle cx="380" cy="325" r="12" fill="#7c3aed"/><circle cx="610" cy="55" r="12" fill="#ea580c"/>
  <text x="118" y="451" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1e3a8a">A</text>
  <text x="393" y="317" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#5b21b6">P</text>
  <text x="628" y="64" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#9a3412">B</text>
