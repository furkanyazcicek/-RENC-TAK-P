<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">Kareli zeminde A ve B noktaları</title>
  <desc id="desc">A noktası sol altta, B noktası beş birim sağda ve üç birim yukarıdadır.</desc>
  <rect width="760" height="390" rx="24" fill="#f8fafc"/>
  <g stroke="#cbd5e1" stroke-width="3">
    <line x1="130" y1="65" x2="630" y2="65"/><line x1="130" y1="145" x2="630" y2="145"/>
    <line x1="130" y1="225" x2="630" y2="225"/><line x1="130" y1="305" x2="630" y2="305"/>
    <line x1="130" y1="65" x2="130" y2="305"/><line x1="230" y1="65" x2="230" y2="305"/>
    <line x1="330" y1="65" x2="330" y2="305"/><line x1="430" y1="65" x2="430" y2="305"/>
    <line x1="530" y1="65" x2="530" y2="305"/><line x1="630" y1="65" x2="630" y2="305"/>
  </g>
  <circle cx="130" cy="305" r="12" fill="#2563eb"/><circle cx="630" cy="65" r="12" fill="#ea580c"/>
  <text x="102" y="344" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1e3a8a">A</text>
  <text x="648" y="74" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#9a3412">B</text>
</svg>
