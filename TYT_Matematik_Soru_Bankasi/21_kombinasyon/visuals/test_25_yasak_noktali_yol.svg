<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Yasak noktası bulunan kareli yol</title>
  <desc id="desc">A sol altta, B dört birim sağ ve üç birim yukarıda, geçilmeyecek P noktası iki birim sağ ve bir birim yukarıdadır.</desc>
  <rect width="760" height="430" rx="24" fill="#f8fafc"/>
  <g stroke="#cbd5e1" stroke-width="3">
    <line x1="150" y1="65" x2="610" y2="65"/><line x1="150" y1="165" x2="610" y2="165"/>
    <line x1="150" y1="265" x2="610" y2="265"/><line x1="150" y1="365" x2="610" y2="365"/>
    <line x1="150" y1="65" x2="150" y2="365"/><line x1="265" y1="65" x2="265" y2="365"/>
    <line x1="380" y1="65" x2="380" y2="365"/><line x1="495" y1="65" x2="495" y2="365"/><line x1="610" y1="65" x2="610" y2="365"/>
  </g>
  <circle cx="150" cy="365" r="12" fill="#2563eb"/><circle cx="380" cy="265" r="15" fill="#ffffff" stroke="#dc2626" stroke-width="6"/><circle cx="610" cy="65" r="12" fill="#ea580c"/>
  <path d="M370 255L390 275M390 255L370 275" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <text x="118" y="402" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1e3a8a">A</text>
  <text x="397" y="258" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#991b1b">P</text>
  <text x="628" y="74" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#9a3412">B</text>
</svg>
